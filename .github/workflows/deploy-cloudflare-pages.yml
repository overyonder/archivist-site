name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble public site
        run: |
          mkdir public
          cp -R \
            _headers \
            404.html \
            app-demo \
            assets \
            early-access \
            early-access-confirmation-retry.js \
            early-access-dialog.js \
            early-access-form.js \
            early-access-leave.js \
            early-access.css \
            signup-attribution.js \
            index.html \
            launching.html \
            main.js \
            mark.svg \
            performance.css \
            performance.html \
            policies.js \
            privacy.html \
            pro.css \
            pro.html \
            retool.html \
            robots.txt \
            sitemap.xml \
            signup-dialog.css \
            styles.css \
            theme.css \
            theme.js \
            public/
          if rg -n \
            'static\.cloudflareinsights\.com/beacon\.min\.js|data-cf-beacon' \
            public --glob '*.html'
          then
            echo "::error::Cloudflare Web Analytics is injected automatically; remove manual beacon snippets."
            exit 1
          fi
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=archivist --branch=main --commit-dirty=true
